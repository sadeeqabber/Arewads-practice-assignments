
name: Check Notebooks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jupyter tools
        run: |
          python -m pip install --upgrade pip
          pip install nbformat

      - name: Validate notebook files
        run: |
          echo "Checking notebooks..."
          python -c "
          import nbformat
          from pathlib import Path

          notebooks = list(Path('assignments').glob('*.ipynb'))
          if not notebooks:
              print('No notebooks found.')
              exit(0)

          for nb_path in notebooks:
              print(f'Checking: {nb_path}')
              with open(nb_path, encoding='utf-8') as f:
                  nb = nbformat.read(f, as_version=4)
              print(f'✅ {nb_path.name} is a valid notebook')
          print('All notebooks checked successfully.')
          " 
